name: Hero checks

on:
  pull_request:
    paths:
      - 'src/components/LightHero.svelte'
      - 'src/components/Navbar.astro'
      - 'src/lib/hero/**'
      - 'tests/hero*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hero-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
      - name: Install the existing dependency lockfile
        run: pnpm install --frozen-lockfile
      - name: Scene and GPU resource lifecycle tests
        run: node --test tests/hero*.test.mjs
      - name: Astro production build
        run: pnpm build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/hero-browser" --no-audit --no-fund playwright@1.63.0 pngjs@7.0.0
          node "$RUNNER_TEMP/hero-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser, responsive layout and WebGPU shader validation
        env:
          HERO_BROWSER_DEPS: ${{ runner.temp }}/hero-browser
          HERO_PREVIEW_LOG: '1'
        run: node tests/hero-browser.mjs
      - name: Preserve browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-browser-results
          path: hero-browser-results/
          retention-days: 7
